plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
repositories { mavenCentral() }
loom {
 splitEnvironmentSourceSets()
 mods { minemap { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
 minecraft "com.mojang:minecraft:${minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
 implementation 'com.google.zxing:core:3.5.3'
 include 'com.google.zxing:core:3.5.3'
 testImplementation platform('org.junit:junit-bom:5.13.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform() }
